name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    needs: []
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Wait for build workflows
      run: |
        echo "Waiting for build workflows to complete..."
        sleep 30
    
    - name: Download library artifacts
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build-libraries.yml
        name: id3-library-releases
        path: ./artifacts/libraries
        check_artifacts: true
        search_artifacts: true
        skip_unpack: false
    
    - name: Download example artifacts
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build-examples.yml
        name: id3-examples-windows-x64
        path: ./artifacts/examples
        check_artifacts: true
        search_artifacts: true
        skip_unpack: false
    
    - name: List downloaded artifacts
      run: |
        echo "Library artifacts:"
        ls -lh artifacts/libraries/ || echo "No library artifacts"
        echo "Example artifacts:"
        ls -lh artifacts/examples/ || echo "No example artifacts"
    
    - name: Create release archives
      run: |
        cd artifacts/examples
        zip -r ../../id3-examples-windows-x64.zip .
        cd ../..
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ID3 ${{ steps.version.outputs.version }}
        body: |
          Release ${{ steps.version.outputs.version }} - Automated build from master branch.
          
          **Commit:** ${{ github.sha }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          ## Downloads
          
          ### Libraries (All Platforms)
          - `id3-library-windows-x64.zip` - Windows x64 (Static library + DLL + Import library)
          - `id3-library-linux-x64.tar.gz` - Linux x64 (Static + Shared library)
          - `id3-library-macos-arm64.tar.gz` - macOS ARM64 (Static + Dynamic library)
          
          ### Applications (Windows Only)
          - `id3-examples-windows-x64.zip` - 16 command-line tools with DLL
          
          ## What's Included
          
          **Libraries package contains:**
          - Static library (libID3.a)
          - Shared library (ID3.dll / libID3.so / libID3.dylib)
          - Import library for DLL (libID3.dll.a - Windows only)
          - Public headers (include/ directory)
          
          **Examples package contains:**
          - 16 executable tools (.exe)
          - ID3.dll (required to run the tools)
          - README.md
        files: |
          artifacts/libraries/id3-library-windows-x64.zip
          artifacts/libraries/id3-library-linux-x64.tar.gz
          artifacts/libraries/id3-library-macos-arm64.tar.gz
          id3-examples-windows-x64.zip
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
